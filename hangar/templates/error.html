{% extends "base.html" %}
{% block title %}Error {{ status }} · Hangar{% endblock %}
{% block content %}
<div class="card empty">
  <h1 class="page-title">{{ "No encontrado" if status == 404 else ("Algo ha fallado" if status >= 500 else "Error " ~ status) }}</h1>
  <p>{{ detail }}</p>
  <a class="btn primary" href="/">{{ icon("arrow-left") }} Volver a las máquinas</a>
</div>
{% endblock %}
