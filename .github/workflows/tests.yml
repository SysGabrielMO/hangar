name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias del sistema (libvirt)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvirt-dev pkg-config

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt libvirt-python

      - name: Tests
        run: pytest -q
